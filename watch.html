<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon.png">
    <link rel="icon" type="image/png" sizes="16x16" href="img/favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="img/favicon.png">
    <link rel="icon" type="image/x-icon" href="img/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T Movies - مشاهدة الفيلم</title>
    <meta name="referrer" content="no-referrer">
    
    <!-- مكتبة الأيقونات Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #0a0a0c;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }
        .watch-container {
            width: 90%;
            max-width: 1200px;
            margin: 40px auto;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            padding: 10px 20px;
            background: #e50914;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background 0.3s ease;
        }
        .back-btn:hover {
            background: #b80710;
        }
        .video-container {
            width: 100%;
            background: #141419;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #222;
        }
        .servers-header {
            padding: 15px 20px 5px;
            font-size: 14px;
            color: #aaa;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #serversContainer {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 10px 20px 20px;
            background: #141419;
            border-bottom: 1px solid #222;
        }
        .server-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #22242b;
            color: #ccc;
            border: 1px solid #333642;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .server-btn:hover {
            background: #2d303a;
            color: #fff;
            border-color: #555;
            transform: translateY(-2px);
        }
        .server-btn.active {
            background: #e50914;
            color: #fff;
            border-color: #e50914;
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
        }
        .server-btn i {
            font-size: 15px;
        }
        iframe {
            display: block;
            background: #000;
        }
        .movie-title {
            margin-top: 25px;
            font-size: 26px;
            font-weight: bold;
            color: #fff;
        }
#serversContainer button {
    all: unset; 
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #22242b;
    color: #ccc;
    border: 1px solid #333642;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s ease;
    box-sizing: border-box;
}
#serversContainer button:hover {
    background: #2d303a;
    color: #fff;
    border-color: #555;
    transform: translateY(-2px);
}
#serversContainer button.active {
    background: #e50914;
    color: #fff;
    border-color: #e50914;
    box-shadow: 0 4px 12px rgba(229, 9, 20, 0.4);
}
    </style>

</head>

<body>

    <div class="watch-container">

        <a href="home.html" class="back-btn">
            <i class="fa-solid fa-arrow-right"></i> العودة
        </a>

        <div class="video-container">
            <div class="servers-header">
                <i class="fa-solid fa-server"></i> اختر سيرفر المشاهدة:
            </div>
            <div id="serversContainer"></div>

            <iframe 
                id="movieFrame" 
                width="100%" 
                height="550px" 
                frameborder="0" 
                allowfullscreen 
                scrolling="no"
                allow="autoplay; encrypted-media; picture-in-picture">
            </iframe>
        </div>

        <h1 id="movieTitle">جاري تحميل الفيلم...</h1>

    </div>

    <script src="watch.js"></script>

</body>

</html>
